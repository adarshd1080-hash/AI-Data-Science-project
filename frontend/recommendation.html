<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoodTune AI - Recommendation</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/recommendation.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">

            <i class="fa-solid fa-headphones"></i>

            <span>MoodTune AI</span>

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="recommendation.html" class="active">Recommendation</a></li>

            <li><a href="chatbot.html">Chatbot</a></li>

            <li><a href="explorer.html">Explorer</a></li>

        </ul>

    </nav>

    <!-- ================= MAIN ================= -->

    <section class="recommend-section">

        <h1>

            Find Your Perfect Song

        </h1>

        <p>

            Enter a song name or choose a mood to get AI recommendations.

        </p>

        <!-- Search -->

        <div class="search-box">

            <input
                id="songInput"
                type="text"
                placeholder="Enter song name...">

            <button id="searchBtn">

                <i class="fa-solid fa-search"></i>

                Recommend

            </button>

        </div>

        <!-- Mood Buttons -->

        <div class="filters">

            <h2>Select Your Mood</h2>

            <div class="moods">

                <button
                    class="mood-btn"
                    data-mood="Happy">

                    😊 Happy

                </button>

                <button
                    class="mood-btn"
                    data-mood="Sad">

                    😢 Sad

                </button>

                <button
                    class="mood-btn"
                    data-mood="Relax">

                    😌 Relax

                </button>

                <button
                    class="mood-btn"
                    data-mood="Energetic">

                    ⚡ Energetic

                </button>

                <button
                    class="mood-btn"
                    data-mood="Romantic">

                    ❤️ Romantic

                </button>

            </div>

        </div>

        <!-- Genre -->

        <div class="genre">

            <h2>

                Select Genre

            </h2>

            <select id="genreSelect">

                <option value="">

                    All Genres

                </option>

            </select>

        </div>

    </section>

    <!-- ================= RESULTS ================= -->

    <section class="results">

        <h2>

            Recommended Songs

        </h2>

        <div
            class="song-results"
            id="resultsContainer">

        </div>

    </section>
        <!-- ================= FOOTER ================= -->

    <footer>

        <h3>MoodTune AI</h3>

        <p>

            AI Powered Music Recommendation System

        </p>

        <br>

        <p>

            © 2026 All Rights Reserved

        </p>

    </footer>

    <!-- JavaScript -->
    <script src="js/recommendation.js"></script>

</body>

</html>
