<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoodTune AI - Explorer</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/explorer.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">

            <i class="fa-solid fa-headphones"></i>

            <span>MoodTune AI</span>

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="recommendation.html">Recommendation</a></li>

            <li><a href="chatbot.html">Chatbot</a></li>

            <li><a href="explorer.html" class="active">Explorer</a></li>

        </ul>

    </nav>

    <!-- ================= EXPLORER ================= -->

    <section class="explorer">

        <h1>

            🔍 Music Explorer

        </h1>

        <p>

            Search songs, artists and discover new music.

        </p>

        <div class="search-area">

            <input
                type="text"
                id="searchInput"
                placeholder="Search song or artist...">

            <button id="searchBtn">

                <i class="fa-solid fa-search"></i>

                Search

            </button>

        </div>

        <!-- Filters -->

        <div class="filters">

            <select id="genreFilter">

                <option value="">All Genres</option>

            </select>

        </div>

    </section>

    <!-- ================= RESULTS ================= -->

    <section class="explore-results">

        <h2>

            Music Library

        </h2>

        <div
            class="music-grid"
            id="musicGrid">

            <!-- Songs will come here -->

        </div>

    </section>
        <!-- ================= FOOTER ================= -->

    <footer>

        <h3>MoodTune AI</h3>

        <p>

            AI Powered Music Recommendation System

        </p>

        <br>

        <p>

            © 2026 All Rights Reserved

        </p>

    </footer>

    <!-- Explorer JavaScript -->
    <script src="js/explorer.js"></script>

</body>

</html>
